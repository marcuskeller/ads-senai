<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura SE JavaScript</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/validacao.js"></script>
</head>

<body>
    <section>
        <h2>Atividade - Promoção de Loja</h2>
        <font face="arial">
            <form name="frmncompra" action="#" method="get" onsubmit="return validaFormulario()">
                <fieldset class="cadcompra">
                    <legend>Entrada de dados</legend>
                    <br>
                        <label for="valorCompra">Valor da compra :</label>
                        <input type="text" name="txtcompra" id="valorCompra"><br>
                    <br>
                    <div class="opcoes">
                        <label>Possui cupom de desconto?</label><br>
                        <input type="radio" name="rddocumento" value="S">Sim
                        <input type="radio" name="rddocumento" value="N">Não
                    </div><br>
                    <br>
                    <button type="reset">Limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>

</body>

</html>
