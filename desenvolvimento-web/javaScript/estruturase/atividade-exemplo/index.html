<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/config.css">
    <script src="js/validacao.js"></script>
    <title>Estrutura SE JavaScript</title>
</head>
<body>
    <section>
        <h2>Estruturas SE(if())</h2>
        <font face="Arial">
            <form name="frmcadastro" action="#" method="get" onsubmit="return validaFormulario()">
                <fieldset class="cadbasico">
                    <legend>Dados pessoais</legend>
                    <br>
                    <label for="nome">Nome: </label>
                    <input type="text" name="txtnome" id="nome" placeholder="Insira seu nome"><br>
                    <br>
                    <label for="telefone">Telefone: </label>
                    <input type="text" name="txtfone" id="telefone"><br>
                    <br>
                    <label for="email">Email</label>
                    <input type="email" name="txtemail" id="email">
                    <button type="reset">Limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>
</body>
</html>
