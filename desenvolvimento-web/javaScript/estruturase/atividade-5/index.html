<!-- Faça um algoritmo para ler dois números por exemplo: numero1 e numero2. Em
seguida, diga se numero1 > numero2 ou se numero2 > numero1 ou ainda se
numero1 = numero2.-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/validacao.js"></script>
    <title>Atividade 5</title>
</head>

<body>
    <section>
        <h2>Atividade - Ler 2 números</h2>
        <font face="Arial">
            <form name="frmtstidadese" action="#" method="get" onsubmit="return validaFormulario()">
                <fieldset class="cadNumeros">
                    <legend>Entrada de dados</legend>
                    <br>
                    <label for="numero1">Número 1</label>
                    <input type="number" name="txtnumero1" id="numero1"><br>
                    <br>
                    <label for="numero2">Número 2</label>
                    <input type="number" name="txtnumero2" id="numero2"><br>
                    <br>
                    <button type="reset">Limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>
