<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura SE JavaScript</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/validacao.js"></script>
</head>

<body>
    <section>
        <h2>Atividade - Controle de entrada no Cinema</h2>
        <font face="arial">
            <form name="frmnnumero" action="#" method="get" onsubmit="return validaFormulario()">
                <fieldset class="cadidade">
                    <legend>Entrada de dados</legend>
                    <br>
                        <label for="idade">Idade :</label>
                        <input type="text" name="txtidade" id="idade"><br>
                    <br>
                    <div class="opcoes">
                        <label>Possui documento com foto?</label><br>
                        <input type="radio" name="rddocumento" value="S">Sim
                        <input type="radio" name="rddocumento" value="N">Não
                    </div><br>
                    <br>
                    <button type="reset">Limpar</button><button type="submit">Enviar</button>
                </fieldset>
            </form>
        </font>
    </section>

</body>

</html>
